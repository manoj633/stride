<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="rocketWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="flameCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Stars / Ambient particles -->
  <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.8" />
  <circle cx="48" cy="14" r="1.1" fill="#ffffff" opacity="0.9" />
  <circle cx="52" cy="34" r="0.7" fill="#ffffff" opacity="0.6" />
  <circle cx="12" cy="42" r="0.8" fill="#38bdf8" opacity="0.7" />

  <!-- Ambient Glow Behind Flame -->
  <circle cx="32" cy="42" r="20" fill="url(#flameGlow)" />

  <!-- Earth Arc at bottom -->
  <path d="M 0 58 Q 32 46 64 58 L 64 64 L 0 64 Z" fill="#1e3a8a" opacity="0.7" />
  <path d="M 0 58 Q 32 46 64 58" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.8" />

  <!-- Exhaust Plume -->
  <path d="M 29 36 Q 28 48 32 58 Q 36 48 35 36 Z" fill="url(#flameCore)" />
  <path d="M 30.5 36 Q 30 44 32 50 Q 34 44 33.5 36 Z" fill="#ffffff" opacity="0.9" />

  <!-- Rocket Wings -->
  <!-- Left fin -->
  <path d="M 27 28 C 24 33 21 38 22 41 C 24 40 26 39 28 37 Z" fill="url(#rocketWing)" />
  <!-- Right fin -->
  <path d="M 37 28 C 40 33 43 38 42 41 C 40 40 38 39 36 37 Z" fill="url(#rocketWing)" />

  <!-- Rocket Fuselage -->
  <path d="M 32 10 C 26 18 26 32 28 37 L 36 37 C 38 32 38 18 32 10 Z" fill="url(#rocketBody)" />

  <!-- Porthole Window -->
  <circle cx="32" cy="22" r="3.2" fill="#0f172a" />
  <circle cx="32" cy="22" r="2.2" fill="#38bdf8" />
  <circle cx="31.2" cy="21.2" r="0.8" fill="#ffffff" />

  <!-- Fuselage Nose Highlight & Shading -->
  <path d="M 32 10 C 29 18 29 30 30 36 C 30.8 36.4 31.5 36.6 32 36.6 C 32 20 32 10 32 10 Z" fill="#ffffff" opacity="0.4" />
</svg>
